<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ficha de Treino</title>
<meta name="theme-color" content="#131922">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ficha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna para celular — barra superior fixa, conteúdo rolável, abas fixas embaixo; o treino em andamento abre como camada de tela cheia */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#E3E8EF; --ink:#131922; --muted:#5A6577; --line:#D3DAE3;
  --accent:#1C58D0; --accent-ink:#FFFFFF; --accent-soft:#DCE6FA;
  --ok:#1F7D4C; --warn:#A87700; --bad:#C62F3A; --violet:#6A4FC6; --teal:#0D8682; --orange:#C25E17; --slate:#66748A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --surface:#161C25; --surface-2:#202836; --ink:#E7ECF3; --muted:#94A1B4; --line:#2A3443;
  --accent:#6A97FF; --accent-ink:#0B1530; --accent-soft:#1D2A47;
  --ok:#4CC38A; --warn:#F0BE4A; --bad:#FF6B76; --violet:#A893FF; --teal:#3FC7C0; --orange:#F2925A; --slate:#8C9AB0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#161C25; --surface-2:#202836; --ink:#E7ECF3; --muted:#94A1B4; --line:#2A3443;
  --accent:#6A97FF; --accent-ink:#0B1530; --accent-soft:#1D2A47;
  --ok:#4CC38A; --warn:#F0BE4A; --bad:#FF6B76; --violet:#A893FF; --teal:#3FC7C0; --orange:#F2925A; --slate:#8C9AB0;
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
.status.act{background:var(--accent);color:var(--accent-ink);cursor:pointer}
.status.err{background:var(--bad);color:var(--surface);cursor:pointer}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;color:var(--ink)}
.gbtn svg{width:18px;height:18px}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:1.6rem}
h3{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:2rem;letter-spacing:.02em;text-transform:uppercase}
.brand .plate{display:inline-flex;gap:3px;align-self:center}
.brand .plate i{display:block;width:5px;border-radius:2px}
.status{font-size:.75rem;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:0;cursor:default}
.status.demo{background:var(--warn);color:var(--bg);cursor:pointer}

.view{display:flex;flex-direction:column;gap:22px;padding-top:6px}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rcard .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px 3px 7px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--slate))}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.banner .btn{background:var(--accent-ink);color:var(--accent);border:0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;min-height:52px}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:.82rem;color:var(--muted)}
.chev{color:var(--muted);flex:none}

.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:.75rem;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--bad)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.chart .end{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--body)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:112px 1fr 44px;align-items:center;gap:10px;font-size:.88rem}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{position:relative;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c,var(--accent))}
.bar .band{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--muted);border-right:1.5px dashed var(--muted);opacity:.6}
.bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:300px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.heat i.on{background:var(--accent)}
.heat i.fut{background:transparent}

.insight{display:flex;gap:12px;align-items:flex-start}
.insight .mark{width:6px;align-self:stretch;border-radius:3px;background:var(--c,var(--accent));flex:none}
.insight .grow{display:flex;flex-direction:column;gap:3px;min-width:0}
.insight b{font-weight:700}

.rank{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .pos{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--muted)}
.rank .pct{font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}

/* corpo */
.body-card{flex-direction:row;align-items:center;gap:16px}
.body-fig{flex:0 0 42%;max-width:180px}
.body-svg{width:100%;height:auto;display:block}
.body-svg .head{fill:var(--surface-2);stroke:var(--line)}
.rg>*{stroke:var(--surface);stroke-width:2}
.rg.na>*{fill:var(--surface-2)}
.rg.ok>*{fill:var(--ok);fill-opacity:.55}
.rg.low>*{fill:var(--warn)}
.rg.high>*{fill:var(--bad)}
.body-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.legend{display:grid;grid-template-columns:1fr;gap:5px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.lg{width:11px;height:11px;border-radius:3px;display:inline-block}
.lg.ok{background:var(--ok);opacity:.7}.lg.low{background:var(--warn)}.lg.high{background:var(--bad)}.lg.na{background:var(--surface-2);border:1px solid var(--line)}
.kv{display:flex;flex-direction:column;gap:8px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:.72rem;color:var(--muted)}
.kv b{font-family:var(--display);font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.prop{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0;padding-bottom:0}
.pv{font-family:var(--display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.warnc{color:var(--warn)}
.ptrack{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.pfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.pfill.ok{background:var(--ok)}.pfill.low{background:var(--warn)}.pfill.high{background:var(--bad)}
.pmark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.ex-chip{border:1px solid var(--line);cursor:pointer;font-size:.82rem;padding:6px 10px}
.empty{text-align:left;display:flex;flex-direction:column;gap:12px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}

svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,10,20,.5)}
.sheet{position:relative;width:100%;max-width:600px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%;min-width:0}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.ed-item{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ed-item .top-row{display:flex;align-items:center;gap:8px}
.ed-item .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ed-item .grid4 .inp{height:40px;text-align:center;padding:0 4px}
.ed-item .grid4 label{font-size:.7rem;text-align:center}

/* session layer */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.s-top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.clock{font-family:var(--display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.s-body{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-card .hd{display:flex;align-items:flex-start;gap:10px}
.ex-card .hd .grow{flex:1;min-width:0}
.hint{font-size:.8rem;color:var(--muted)}
.sug{font-size:.82rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:8px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set.head{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.set .n{font-family:var(--display);font-weight:700;font-size:1.2rem;text-align:center;color:var(--muted)}
.set input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:600;font-size:1.05rem;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.set .ck{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.set.done input{background:var(--accent-soft);border-color:transparent}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set.done .n{color:var(--ok)}
.s-actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.s-actions .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.rest{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--ink);color:var(--bg)}
.rest .t{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px}
.rest .prog{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.rest .prog i{display:block;height:100%;background:var(--accent)}
.rest button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:8px;height:34px;padding:0 10px;font-weight:700;cursor:pointer}
.rest.over{background:var(--ok)}

.rir{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0 6px 36px;font-size:.8rem;color:var(--muted)}
.rir span{flex-basis:100%}
.rir button{min-width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.rir button.skip{font-weight:500;color:var(--muted);border-color:transparent;background:none}
.wu{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.wu table.hist td{border-top-color:var(--line)}
.col{display:flex;flex-direction:column;gap:8px}
.top-actions{display:flex;align-items:center;gap:8px}
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.ph{flex:0 0 112px;display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.nophoto{background:var(--surface-2)}
.ph img,.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2);display:block;max-width:100%}
.ph span{font-size:.75rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{display:flex;flex-direction:column;gap:6px;min-width:0}
textarea.inp{height:140px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:.75rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pr{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--warn);color:var(--bg)}
table.hist{width:100%;border-collapse:collapse;font-size:.88rem}
table.hist td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
table.hist td:last-child{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:330px){.tiles{grid-template-columns:1fr 1fr}.bar{grid-template-columns:92px 1fr 40px}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="plate" aria-hidden="true"><i style="height:26px;background:var(--bad)"></i><i style="height:22px;background:var(--accent)"></i><i style="height:18px;background:var(--warn)"></i><i style="height:14px;background:var(--ok)"></i></span>
      <h1>Ficha</h1>
    </div>
